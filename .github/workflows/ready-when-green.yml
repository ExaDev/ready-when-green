name: Ready when green

# This repository uses its own action, from the default branch's copy (workflow_run runs the default branch's workflows, and the checkout below is of that same branch, never of pull request code). A draft labelled `automerge` is marked ready for review with the organisation's GitHub App once CI's "Required Checks" job has passed; the ready_for_review event that starts then runs merge-when-green.yml, which merges it.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

concurrency:
  group: ready-when-green-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read
  checks: read

jobs:
  ready:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          app-private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          required-check: Required Checks
