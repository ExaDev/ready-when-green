name: Merge when green

# Runs merge-when-green beside this repository's own ready-when-green.yml, as its README suggests. A pull request labelled `automerge` is rebase-merged with the organisation's GitHub App once CI's "Required Checks" job has passed; a draft is left until ready-when-green.yml marks it ready, and the ready_for_review event that causes starts this workflow again.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  pull_request_target:
    types: [labeled, ready_for_review]

concurrency:
  group: merge-when-green-${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read
  checks: read

jobs:
  merge:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success')
      || (github.event_name == 'pull_request_target' && contains(github.event.pull_request.labels.*.name, 'automerge'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: ExaDev/merge-when-green@v1
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          app-private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          required-check: Required Checks
